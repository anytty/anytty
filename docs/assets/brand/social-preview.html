<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=1280,initial-scale=1">
<title>AnyTTY GitHub social preview</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: #f5f8fa; color: #132e40; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  main { position: absolute; left: 76px; top: 60px; width: 710px; }
  .brand { font-size: 82px; line-height: 1; font-weight: 780; letter-spacing: -3px; }
  .brand span { color: #0899d3; }
  h1 { margin: 49px 0 23px; font-size: 48px; line-height: 1.12; letter-spacing: -1.8px; font-weight: 680; }
  p { margin: 0; font-size: 24px; line-height: 1.5; color: #526979; }
  .mascot { position: absolute; width: 470px; height: 470px; object-fit: contain; right: 28px; top: 38px; }
  .cursor { display: inline-block; width: 15px; height: 43px; margin-left: 9px; background: #28ca99; vertical-align: -3px; }
  footer { position: absolute; left: 76px; right: 76px; bottom: 52px; border-top: 1px solid #cad8df; padding-top: 27px; display: flex; justify-content: space-between; align-items: center; }
  .surfaces { display: flex; gap: 25px; align-items: center; font-size: 21px; font-weight: 620; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: #7f99a7; }
  .repo { font: 19px 'SFMono-Regular', Menlo, monospace; color: #526979; }
</style>
<main>
  <div class="brand">Any<span>TTY</span></div>
  <h1>Any machine. Any task.<br>Any client. Any time.<br>That's AnyTTY.<i class="cursor"></i></h1>
  <p>Persistent sessions on your own machines.<br>Connect, take control, and manage files.</p>
</main>
<img class="mascot" src="app-icon-1024.png" alt="AnyTTY blue gecko holding a green phone">
<footer>
  <div class="surfaces"><span>CLI</span><i class="dot"></i><span>TUI</span><i class="dot"></i><span>Web</span><i class="dot"></i><span>iOS</span><i class="dot"></i><span>Android</span></div>
  <div class="repo">github.com/anytty/anytty</div>
</footer>
</html>
