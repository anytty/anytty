name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/assets/**
      - scripts/check-public-repository.mjs
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run site:check
        env:
          ANYTTY_SITE_CUSTOM_DOMAIN: ${{ vars.ANYTTY_SITE_CUSTOM_DOMAIN || 'false' }}
          ANYTTY_SITE_BASE_PATH: /anytty
          PUBLIC_ANYTTY_SITE_URL: ${{ vars.ANYTTY_SITE_URL || 'https://lozzo.github.io/anytty' }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
