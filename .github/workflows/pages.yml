name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/assets/**
      - scripts/check-public-repository.mjs
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Detect Pages URL mode
        id: site-mode
        shell: bash
        run: |
          if [[ -s site/public/CNAME ]]; then
            domain="$(head -n 1 site/public/CNAME | tr -d '[:space:]')"
            echo "custom_domain=true" >> "$GITHUB_OUTPUT"
            echo "base_path=/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${domain}" >> "$GITHUB_OUTPUT"
          else
            echo "custom_domain=false" >> "$GITHUB_OUTPUT"
            echo "base_path=/anytty" >> "$GITHUB_OUTPUT"
            echo "site_url=https://anytty.github.io/anytty" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run site:check
        env:
          ANYTTY_SITE_CUSTOM_DOMAIN: ${{ steps.site-mode.outputs.custom_domain }}
          ANYTTY_SITE_BASE_PATH: ${{ steps.site-mode.outputs.base_path }}
          PUBLIC_ANYTTY_SITE_URL: ${{ steps.site-mode.outputs.site_url }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
