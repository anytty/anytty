name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make test
      - run: make test-clients
      - run: npm run public:check

  flutter-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=1
        -Dorg.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G
        -Dkotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$ANDROID_NDK_VERSION"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Verify Flutter and Go layers
        working-directory: clients/flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          go test ../../client/binding/...
      - name: Build arm64 Flutter release APK
        working-directory: clients/flutter
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Verify Flutter release boundary
        env:
          ANYTTY_ANDROID_EXPECTED_ABIS: arm64-v8a
          ANYTTY_ANDROID_REQUIRE_SIGNATURE: 1
          ANYTTY_ANDROID_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
        run: scripts/verify-flutter-android-apk-boundary.sh clients/flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  flutter-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Build iOS native frameworks
        run: scripts/build-flutter-ios-native.sh
      - name: Build iOS simulator application
        working-directory: clients/flutter
        run: flutter build ios --simulator --debug
