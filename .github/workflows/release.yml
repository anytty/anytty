name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  ANDROID_NDK_VERSION: 28.2.13676358

jobs:
  cli:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release version
        run: test "$(tr -d '[:space:]' < VERSION)" = "$RELEASE_TAG"
      - name: Build CLI release archives
        run: scripts/build-release-artifacts.sh "$RELEASE_TAG" "$RUNNER_TEMP/cli"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-assets
          path: ${{ runner.temp }}/cli/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      ANYTTY_ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANYTTY_ANDROID_UPLOAD_STORE_PASSWORD }}
      ANYTTY_ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANYTTY_ANDROID_UPLOAD_KEY_ALIAS }}
      ANYTTY_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANYTTY_ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$ANDROID_NDK_VERSION"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Validate mobile release version
        working-directory: clients/flutter
        run: |
          app_version="$(sed -n 's/^version: //p' pubspec.yaml)"
          test "${app_version%%+*}" = "${RELEASE_TAG#v}"
          build_number="${app_version##*+}"
          test "$build_number" -gt 0
      - name: Configure Android release signing
        env:
          ANYTTY_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANYTTY_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          for name in \
            ANYTTY_ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANYTTY_ANDROID_UPLOAD_STORE_PASSWORD \
            ANYTTY_ANDROID_UPLOAD_KEY_ALIAS \
            ANYTTY_ANDROID_UPLOAD_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing required GitHub Actions secret: $name" >&2; exit 1; }
          done
          keystore="$RUNNER_TEMP/anytty-upload-keystore.jks"
          umask 077
          printf '%s' "$ANYTTY_ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode >"$keystore"
          test -s "$keystore"
          echo "ANYTTY_ANDROID_UPLOAD_STORE_FILE=$keystore" >>"$GITHUB_ENV"
      - name: Build signed Android release APKs and AAB
        env:
          ANYTTY_ANDROID_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
        working-directory: clients/flutter
        run: |
          flutter pub get
          flutter build appbundle --release \
            --target-platform android-arm,android-arm64,android-x64
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64
      - name: Verify and stage Android packages
        run: |
          apk_dir="clients/flutter/build/app/outputs/flutter-apk"
          verify_apk() {
            local source="$1" abi="$2" target="$3" max_bytes="${4:-83886080}"
            ANYTTY_ANDROID_EXPECTED_ABIS="$abi" \
              ANYTTY_FLUTTER_ANDROID_MAX_APK_BYTES="$max_bytes" \
              ANYTTY_ANDROID_REQUIRE_SIGNATURE=1 \
              scripts/verify-flutter-android-apk-boundary.sh "$apk_dir/$source"
            cp "$apk_dir/$source" "$RUNNER_TEMP/$target"
          }
          verify_apk app-armeabi-v7a-release.apk armeabi-v7a \
            "anytty-$RELEASE_TAG-android-armeabi-v7a.apk"
          verify_apk app-arm64-v8a-release.apk arm64-v8a \
            "anytty-$RELEASE_TAG-android-arm64-v8a.apk"
          verify_apk app-x86_64-release.apk x86_64 \
            "anytty-$RELEASE_TAG-android-x86_64.apk"
          verify_apk app-release.apk "armeabi-v7a arm64-v8a x86_64" \
            "anytty-$RELEASE_TAG-android-universal.apk" 209715200

          aab="clients/flutter/build/app/outputs/bundle/release/app-release.aab"
          ANYTTY_ANDROID_EXPECTED_ABIS="armeabi-v7a arm64-v8a x86_64" \
          scripts/verify-android-aab-boundary.sh "$aab"
          cp "$aab" "$RUNNER_TEMP/anytty-$RELEASE_TAG-android-play.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: ${{ runner.temp }}/anytty-${{ env.RELEASE_TAG }}-android-*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [cli, android]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Write build metadata and final checksums
        run: scripts/write-release-metadata.sh "$RELEASE_TAG" "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/create-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release"
