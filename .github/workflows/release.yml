name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release version
        run: test "$(tr -d '[:space:]' < VERSION)" = "$RELEASE_TAG"
      - name: Build CLI release archives
        run: scripts/build-release-artifacts.sh "$RELEASE_TAG" "$RUNNER_TEMP/cli"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-assets
          path: ${{ runner.temp }}/cli/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$ANDROID_NDK_VERSION"
      - run: npm ci
      - name: Build unsigned Android release APK
        env:
          ANYTTY_ANDROID_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
        run: |
          npm run cap:build
          clients/mobile/android/gradlew --no-daemon -p clients/mobile/android assembleRelease
      - name: Verify and stage Android APK
        run: |
          apk="clients/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          scripts/verify-android-apk-boundary.sh "$apk"
          cp "$apk" "$RUNNER_TEMP/anytty-$RELEASE_TAG-android-universal-unsigned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-asset
          path: ${{ runner.temp }}/anytty-${{ env.RELEASE_TAG }}-android-universal-unsigned.apk
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [cli, android]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Write build metadata and final checksums
        run: scripts/write-release-metadata.sh "$RELEASE_TAG" "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/create-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release"
