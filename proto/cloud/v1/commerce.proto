syntax = "proto3";

package anytty.cloud.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/anytty/anytty/proto/cloud/v1;cloudv1";

enum PlanState {
  PLAN_STATE_UNSPECIFIED = 0;
  PLAN_STATE_DRAFT = 1;
  PLAN_STATE_PUBLISHED = 2;
  PLAN_STATE_RETIRED = 3;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PAID = 2;
  ORDER_STATUS_PAYMENT_FAILED = 3;
  ORDER_STATUS_REFUNDED = 4;
  ORDER_STATUS_REVOKED = 5;
}

enum PaymentAttemptStatus {
  PAYMENT_ATTEMPT_STATUS_UNSPECIFIED = 0;
  PAYMENT_ATTEMPT_STATUS_PENDING = 1;
  PAYMENT_ATTEMPT_STATUS_SUCCEEDED = 2;
  PAYMENT_ATTEMPT_STATUS_FAILED = 3;
}

enum PaymentEventType {
  PAYMENT_EVENT_TYPE_UNSPECIFIED = 0;
  PAYMENT_EVENT_TYPE_SUCCEEDED = 1;
  PAYMENT_EVENT_TYPE_FAILED = 2;
  PAYMENT_EVENT_TYPE_REFUNDED = 3;
  PAYMENT_EVENT_TYPE_REVOKED = 4;
  PAYMENT_EVENT_TYPE_CHARGEBACK = 5;
}

enum SubscriptionState {
  SUBSCRIPTION_STATE_UNSPECIFIED = 0;
  SUBSCRIPTION_STATE_ACTIVE = 1;
  SUBSCRIPTION_STATE_CANCEL_AT_PERIOD_END = 2;
  SUBSCRIPTION_STATE_CANCELED = 3;
  SUBSCRIPTION_STATE_SUSPENDED = 4;
  SUBSCRIPTION_STATE_EXPIRED = 5;
  SUBSCRIPTION_STATE_PAST_DUE = 6;
}

enum SubscriptionTransition {
  SUBSCRIPTION_TRANSITION_UNSPECIFIED = 0;
  SUBSCRIPTION_TRANSITION_ACTIVATE = 1;
  SUBSCRIPTION_TRANSITION_RENEW = 2;
  SUBSCRIPTION_TRANSITION_UPGRADE = 3;
  SUBSCRIPTION_TRANSITION_DOWNGRADE = 4;
  SUBSCRIPTION_TRANSITION_CANCEL_AT_PERIOD_END = 5;
  SUBSCRIPTION_TRANSITION_RESUME = 6;
  SUBSCRIPTION_TRANSITION_SUSPEND = 7;
  SUBSCRIPTION_TRANSITION_RESTORE = 8;
  SUBSCRIPTION_TRANSITION_EXPIRE = 9;
  SUBSCRIPTION_TRANSITION_REFUND = 10;
  SUBSCRIPTION_TRANSITION_REVOKE = 11;
}

enum EntitlementState {
  ENTITLEMENT_STATE_UNSPECIFIED = 0;
  ENTITLEMENT_STATE_ACTIVE = 1;
  ENTITLEMENT_STATE_SUSPENDED = 2;
  ENTITLEMENT_STATE_EXPIRED = 3;
}

// Money 使用最小货币单位，避免浮点金额进入交易状态机。
message Money {
  string currency = 1;
  int64 minor_units = 2;
}

// CloudCapability 是套餐和运行时票据共同消费的机器限制。
message CloudCapability {
  bool managed_p2p_enabled = 1;
  // 兼容旧套餐数据；Managed P2P 不执行并发数量限制。
  uint32 managed_p2p_max_concurrency = 2;
  bool relay_enabled = 3;
  uint32 relay_max_concurrency = 4;
  uint64 relay_max_bytes_per_period = 5;
  uint64 relay_max_bytes_per_lease = 6;
  uint64 relay_max_rate_bytes_per_second = 7;
  uint32 cloud_daemon_limit = 8;
  repeated string allowed_regions = 9;
}

// PlanDefinition 是一个不可变套餐版本；已发布版本只能退休，不能原地改写。
message PlanDefinition {
  string plan_id = 1;
  uint64 version = 2;
  string name = 3;
  string description = 4;
  PlanState state = 5;
  uint32 billing_period_days = 6;
  Money monthly_price = 7;
  Money yearly_price = 8;
  CloudCapability capability = 9;
  uint64 revision = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp published_at = 12;
}

message OrderProjection {
  string order_id = 1;
  string account_id = 2;
  string plan_id = 3;
  uint64 plan_version = 4;
  OrderStatus status = 5;
  Money amount = 6;
  string provider = 7;
  string provider_reference = 8;
  string idempotency_key = 9;
  SubscriptionTransition requested_transition = 10;
  uint64 revision = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp settled_at = 13;
}

message PaymentAttemptProjection {
  string payment_attempt_id = 1;
  string order_id = 2;
  string account_id = 3;
  string provider = 4;
  string provider_reference = 5;
  PaymentAttemptStatus status = 6;
  uint64 revision = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message SubscriptionProjection {
  string subscription_id = 1;
  string account_id = 2;
  string plan_id = 3;
  uint64 plan_version = 4;
  string source_order_id = 5;
  SubscriptionState state = 6;
  bool cancel_at_period_end = 7;
  uint64 revision = 8;
  google.protobuf.Timestamp period_start = 9;
  google.protobuf.Timestamp period_end = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// EffectiveEntitlement 是签发 Cloud 票据时冻结限制的唯一商业真值。
message EffectiveEntitlement {
  string account_id = 1;
  EntitlementState state = 2;
  string plan_id = 3;
  uint64 plan_version = 4;
  string subscription_id = 5;
  CloudCapability capability = 6;
  uint64 relay_used_bytes = 7;
  uint64 relay_remaining_bytes = 8;
  google.protobuf.Timestamp effective_from = 9;
  google.protobuf.Timestamp effective_until = 10;
  google.protobuf.Timestamp computed_at = 11;
}

message UsagePeriodProjection {
  string account_id = 1;
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end = 3;
  uint64 relay_ingress_bytes = 4;
  uint64 relay_egress_bytes = 5;
  uint64 relay_total_bytes = 6;
  uint64 quota_bytes = 7;
  uint64 remaining_bytes = 8;
  uint64 revision = 9;
  uint32 active_relay_reservations = 10;
  uint64 relay_held_bytes = 11;
}

message ListPlansRequest { bool include_unpublished = 1; }
message ListPlansResponse { repeated PlanDefinition plans = 1; }

message CreatePlanVersionRequest {
  string plan_id = 1;
  string name = 2;
  string description = 3;
  uint32 billing_period_days = 4;
  Money monthly_price = 5;
  Money yearly_price = 6;
  CloudCapability capability = 7;
}
message CreatePlanVersionResponse { PlanDefinition plan = 1; }

message PublishPlanVersionRequest {
  string plan_id = 1;
  uint64 version = 2;
  uint64 expected_revision = 3;
}
message PublishPlanVersionResponse { PlanDefinition plan = 1; }

message CreateOrderRequest {
  string account_id = 1;
  string plan_id = 2;
  uint64 plan_version = 3;
  string provider = 4;
  string idempotency_key = 5;
  SubscriptionTransition requested_transition = 6;
  bool yearly = 7;
}
message CreateOrderResponse {
  OrderProjection order = 1;
  PaymentAttemptProjection payment_attempt = 2;
}

message ApplyPaymentEventRequest {
  string provider = 1;
  string provider_event_id = 2;
  string payment_attempt_id = 3;
  string order_id = 4;
  PaymentEventType event_type = 5;
  string provider_reference = 6;
  google.protobuf.Timestamp occurred_at = 7;
}
message ApplyPaymentEventResponse {
  OrderProjection order = 1;
  PaymentAttemptProjection payment_attempt = 2;
  SubscriptionProjection subscription = 3;
  EffectiveEntitlement entitlement = 4;
  bool duplicate = 5;
}

message TransitionSubscriptionRequest {
  string account_id = 1;
  SubscriptionTransition transition = 2;
  string target_plan_id = 3;
  uint64 target_plan_version = 4;
  uint64 expected_revision = 5;
  string reason = 6;
}
message TransitionSubscriptionResponse {
  SubscriptionProjection subscription = 1;
  EffectiveEntitlement entitlement = 2;
}

message GetAccountCommerceRequest { string account_id = 1; }
message GetAccountCommerceResponse {
  SubscriptionProjection subscription = 1;
  EffectiveEntitlement entitlement = 2;
  repeated OrderProjection orders = 3;
  repeated PaymentAttemptProjection payment_attempts = 4;
  UsagePeriodProjection usage = 5;
}

// CreateMyOrderRequest 不接受 account_id 或 provider；两者由认证 session 和部署模式决定。
message CreateMyOrderRequest {
  string plan_id = 1;
  uint64 plan_version = 2;
  string idempotency_key = 3;
  SubscriptionTransition requested_transition = 4;
  bool yearly = 5;
}

message GetMyCommerceRequest {}

// ChangeMySubscriptionRequest 只承载用户可执行的取消到期和恢复动作。
message ChangeMySubscriptionRequest {
  SubscriptionTransition transition = 1;
  uint64 expected_revision = 2;
}

// CompleteDevelopmentPaymentRequest 仅在显式 Development 支付模式下可用。
message CompleteDevelopmentPaymentRequest {
  string order_id = 1;
  string payment_attempt_id = 2;
}

// CommerceService 拥有套餐、订单、支付、订阅和 Entitlement 状态机。
service CommerceService {
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc CreatePlanVersion(CreatePlanVersionRequest) returns (CreatePlanVersionResponse);
  rpc PublishPlanVersion(PublishPlanVersionRequest) returns (PublishPlanVersionResponse);
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc ApplyPaymentEvent(ApplyPaymentEventRequest) returns (ApplyPaymentEventResponse);
  rpc TransitionSubscription(TransitionSubscriptionRequest) returns (TransitionSubscriptionResponse);
  rpc GetAccountCommerce(GetAccountCommerceRequest) returns (GetAccountCommerceResponse);
  rpc CreateMyOrder(CreateMyOrderRequest) returns (CreateOrderResponse);
  rpc GetMyCommerce(GetMyCommerceRequest) returns (GetAccountCommerceResponse);
  rpc ChangeMySubscription(ChangeMySubscriptionRequest) returns (TransitionSubscriptionResponse);
  rpc CompleteDevelopmentPayment(CompleteDevelopmentPaymentRequest) returns (ApplyPaymentEventResponse);
}
