syntax = "proto3";

package anytty.cloud.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/anytty/anytty/proto/cloud/v1;cloudv1";

// EdgePublicCertificateStatus is the current automatically managed TLS
// credential presented by an Edge public endpoint. Private key material never
// leaves the Edge and is never part of this projection.
message EdgePublicCertificateStatus {
  string public_endpoint = 1;
  bytes certificate_sha256 = 2;
  google.protobuf.Timestamp not_before = 3;
  google.protobuf.Timestamp not_after = 4;
  bool renewal_pending = 5;
  string last_error_code = 6;
  string last_error_message = 7;
  google.protobuf.Timestamp last_attempt_at = 8;
  google.protobuf.Timestamp applied_at = 9;
}

// EdgePublicCertificateRenewRequest is sent only inside an authenticated
// EdgeControl stream. The new private key is generated and retained by Edge.
message EdgePublicCertificateRenewRequest {
  string request_id = 1;
  bytes csr_pem = 2;
  bytes current_certificate_sha256 = 3;
  google.protobuf.Timestamp requested_at = 4;
}

// EdgePublicCertificateRenewResponse contains a serverAuth chain signed for
// the Controller-owned public_endpoint of the authenticated Edge.
message EdgePublicCertificateRenewResponse {
  string request_id = 1;
  bytes certificate_pem = 2;
  bytes certificate_sha256 = 3;
  google.protobuf.Timestamp not_before = 4;
  google.protobuf.Timestamp not_after = 5;
}

// EdgePublicCertificateApplied reports atomic persistence and TLS hot reload.
// A failed application leaves the previously loaded credential untouched.
message EdgePublicCertificateApplied {
  string request_id = 1;
  EdgePublicCertificateStatus status = 2;
  bool applied = 3;
  string error_code = 4;
  string error_message = 5;
}
