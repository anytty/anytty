syntax = "proto3";

package anytty.cloud.v1;

import "cloud/v1/common.proto";
import "cloud/v1/certificate.proto";
import "cloud/v1/edge_config.proto";
import "cloud/v1/enrollment.proto";
import "cloud/v1/runtime.proto";
import "cloud/v1/usage.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/anytty/anytty/proto/cloud/v1;cloudv1";

// EdgeCapability 是 Edge 进程已实现并愿意承诺的版本化能力。
enum EdgeCapability {
  EDGE_CAPABILITY_UNSPECIFIED = 0;
  EDGE_CAPABILITY_CONTROL_STREAM = 1;
  EDGE_CAPABILITY_RELAY = 2;
  EDGE_CAPABILITY_RESERVATION_JOURNAL = 3;
  EDGE_CAPABILITY_CERTIFICATE_HOT_RELOAD = 4;
  EDGE_CAPABILITY_DAEMON_LIFECYCLE_POLICY = 5;
  EDGE_CAPABILITY_DAEMON_EDGE_RESELECTION = 6;
  EDGE_CAPABILITY_IDENTITY_CERTIFICATE_ROTATION = 7;
  EDGE_CAPABILITY_DAEMON_CONNECTION_ADMISSION = 8;
}

// EdgeHello 是 EdgeControl 新连接的第一个且唯一一个注册消息。
// edge_id 必须与 mTLS 客户端证书中的 Edge URI SAN 一致。
message EdgeHello {
  string edge_id = 1;
  string software_version = 2;
  repeated EdgeCapability capabilities = 3;
  uint64 desired_config_version = 4;
  uint64 certificate_version = 5;
  string certificate_profile_id = 6;
}

// EdgeWelcome 表示 Controller 已接受当前 mTLS 连接和协议版本。
// connection_id 由 Edge 每次重连生成，Controller 接受后在外层 ControllerCommand 中回显。
message EdgeWelcome {
  uint32 accepted_protocol_version = 1;
  HeartbeatPolicy heartbeat = 2;
  KeyBundle binding_key_bundle = 3;
  DaemonStateSnapshot daemon_states = 4;
}

// SnapshotBegin 开始当前 connection generation 的临时快照命名空间。
message SnapshotBegin {
  string snapshot_id = 1;
  uint64 revision = 2;
}

// SnapshotChunk 分块传输快照对象；chunk_index 必须从零严格递增。
message SnapshotChunk {
  string snapshot_id = 1;
  uint32 chunk_index = 2;
  repeated AgentPresence agents = 3;
  repeated ClientSessionSummary sessions = 4;
  reserved 5;
}

// SnapshotEnd 携带完整投影的确定性摘要，Controller 校验后才原子发布。
message SnapshotEnd {
  string snapshot_id = 1;
  uint64 revision = 2;
  uint32 chunk_count = 3;
  bytes digest = 4;
}

// EdgeHeartbeat 只报告可合并的最新 runtime revision。
message EdgeHeartbeat {
  uint64 runtime_revision = 1;
}

// SnapshotAccepted 表示 Controller 已原子发布当前快照。
message SnapshotAccepted {
  string snapshot_id = 1;
  uint64 revision = 2;
}

// ResyncRequired 要求 Edge 丢弃当前发送游标并重新获取一致性快照。
message ResyncRequired {
  uint64 expected_revision = 1;
  string reason = 2;
}

// ConfigApplied 是 Edge 验签、校验并原子缓存 desired config 后的结果。
message ConfigApplied {
  uint64 version = 1;
  bool applied = 2;
  string error_code = 3;
}

// CertificateApplied 是 Edge 对证书包完成校验、落盘和热切换后的结果。
// applied=false 时 Edge 必须继续使用此前已加载的证书。
message CertificateApplied {
  string certificate_profile_id = 1;
  uint64 revision = 2;
  bool applied = 3;
  string error_code = 4;
  string error_message = 5;
}

// EdgeIdentityRenewRequest 只允许在已通过当前 EdgeIdentity mTLS 认证的控制流内发送。
// CSR 必须绑定同一 Edge URI SAN；新私钥始终留在 Edge 本机。
message EdgeIdentityRenewRequest {
  string request_id = 1;
  bytes csr_pem = 2;
  bytes current_certificate_sha256 = 3;
  google.protobuf.Timestamp requested_at = 4;
}

// EdgeIdentityRenewResponse 返回 Controller Edge CA 签发的新 clientAuth 叶证书。
message EdgeIdentityRenewResponse {
  string request_id = 1;
  bytes certificate_pem = 2;
  bytes certificate_sha256 = 3;
  google.protobuf.Timestamp not_after = 4;
}

// EdgeIdentityApplied 是 Edge 完成证书/私钥原子持久化和内存热切换后的回执。
message EdgeIdentityApplied {
  string request_id = 1;
  bytes certificate_sha256 = 2;
  google.protobuf.Timestamp not_after = 3;
  bool applied = 4;
  string error_code = 5;
  string error_message = 6;
}

// DaemonStateSnapshot 在 EdgeControl 建连时原子替换 Edge 的内存状态表。
message DaemonStateSnapshot {
  repeated DaemonStateRecord daemons = 1;
}

message DaemonStateDelta { DaemonStateRecord daemon = 1; }

message DaemonStateQuery {
  string request_id = 1;
  string daemon_id = 2;
}

message DaemonStateQueryResult {
  string request_id = 1;
  string daemon_id = 2;
  bool found = 3;
  DaemonStateRecord daemon = 4;
}

enum DaemonConnectionAdmissionResult {
  DAEMON_CONNECTION_ADMISSION_RESULT_UNSPECIFIED = 0;
  DAEMON_CONNECTION_ADMISSION_RESULT_ADMITTED = 1;
  DAEMON_CONNECTION_ADMISSION_RESULT_RELEASED = 2;
  DAEMON_CONNECTION_ADMISSION_RESULT_LIMIT_REACHED = 3;
  DAEMON_CONNECTION_ADMISSION_RESULT_REJECTED = 4;
  DAEMON_CONNECTION_ADMISSION_RESULT_UNAVAILABLE = 5;
}

// DaemonConnectionAdmissionRequest 在 Presence 发布前为一个认证连接申请全局账号名额。
// release=true 释放尚未被 Presence 增量消费的准入；同一 daemon 的重连不重复计数。
message DaemonConnectionAdmissionRequest {
  string request_id = 1;
  string admission_id = 2;
  string daemon_id = 3;
  string account_id = 4;
  string agent_connection_id = 5;
  bool release = 6;
}

message DaemonConnectionAdmissionResponse {
  string request_id = 1;
  string admission_id = 2;
  DaemonConnectionAdmissionResult result = 3;
  uint32 limit = 4;
  string message = 5;
}

message CloseDaemonConnection {
  string command_id = 1;
  string correlation_id = 2;
  google.protobuf.Timestamp deadline = 3;
  string daemon_id = 4;
  uint64 generation = 5;
  string reason = 6;
}

message CloseClientSession {
  string command_id = 1;
  string correlation_id = 2;
  google.protobuf.Timestamp deadline = 3;
  string session_id = 4;
  uint64 generation = 5;
  string reason = 6;
}

message ReselectDaemonEdge {
  string command_id = 1;
  string correlation_id = 2;
  google.protobuf.Timestamp deadline = 3;
  string daemon_id = 4;
  uint64 generation = 5;
  uint64 preference_revision = 6;
}

enum CommandResultCode {
  COMMAND_RESULT_CODE_UNSPECIFIED = 0;
  COMMAND_RESULT_CODE_APPLIED = 1;
  COMMAND_RESULT_CODE_REJECTED = 2;
  COMMAND_RESULT_CODE_STALE = 3;
}

message EdgeCommandResult {
  string command_id = 1;
  string correlation_id = 2;
  CommandResultCode code = 3;
  string message = 4;
  google.protobuf.Timestamp completed_at = 5;
}

// EdgeEvent 是 Edge 向 Controller 发送的单调序列 envelope。
// hello 之后只允许快照、严格连续增量和可合并心跳。
message EdgeEvent {
  uint32 protocol_version = 1;
  string message_id = 2;
  string sender_id = 3;
  string boot_id = 4;
  string connection_id = 5;
  uint64 stream_seq = 6;
  google.protobuf.Timestamp sent_at = 7;
  oneof payload {
    EdgeHello hello = 20;
    SnapshotBegin snapshot_begin = 21;
    SnapshotChunk snapshot_chunk = 22;
    SnapshotEnd snapshot_end = 23;
    RuntimeDelta runtime_delta = 24;
    EdgeHeartbeat heartbeat = 25;
    ConfigApplied config_applied = 26;
    RelayReserveRequest relay_reserve = 28;
    EdgeCommandResult command_result = 29;
    CertificateApplied certificate_applied = 30;
    RelayRenewRequest relay_renew = 31;
    RelaySettlement relay_settle = 32;
    RelayQueryRequest relay_query = 33;
    DaemonStateQuery daemon_state_query = 34;
    EdgeIdentityRenewRequest identity_renew = 35;
    EdgeIdentityApplied identity_applied = 36;
    DaemonConnectionAdmissionRequest daemon_connection_admission = 37;
  }
}

// ControllerCommand 是 Controller 向 Edge 发送的单调序列 envelope。
// welcome 之后由 snapshot_accepted 或 resync_required 驱动同步状态机。
message ControllerCommand {
  uint32 protocol_version = 1;
  string message_id = 2;
  string sender_id = 3;
  string boot_id = 4;
  string connection_id = 5;
  uint64 stream_seq = 6;
  google.protobuf.Timestamp sent_at = 7;
  oneof payload {
    EdgeWelcome welcome = 20;
    SnapshotAccepted snapshot_accepted = 21;
    ResyncRequired resync_required = 22;
    SignedEdgeDesiredConfig desired_config = 23;
    KeyBundle binding_key_bundle = 24;
    RelayReserveResponse relay_reserve = 25;
    CloseDaemonConnection close_daemon = 26;
    CloseClientSession close_session = 27;
    EdgeCertificateBundle certificate_bundle = 28;
    RelayRenewResponse relay_renew = 29;
    RelaySettlementAck relay_settle = 30;
    RelayQueryResponse relay_query = 31;
    DaemonStateDelta daemon_state_delta = 32;
    DaemonStateQueryResult daemon_state_query_result = 33;
    ReselectDaemonEdge reselect_daemon_edge = 34;
    EdgeIdentityRenewResponse identity_renew = 35;
    DaemonConnectionAdmissionResponse daemon_connection_admission = 36;
  }
}

// EdgeControl 是 Edge 与 Controller 之间唯一长连接控制流。
service EdgeControl {
  rpc Connect(stream EdgeEvent) returns (stream ControllerCommand);
}
