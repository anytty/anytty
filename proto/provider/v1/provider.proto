syntax = "proto3";

package anytty.provider.v1;

option go_package = "github.com/anytty/anytty/proto/provider/v1;providerv1";

// AnyTTY internal terminal provider protocol (daemon <- access only).
//
// This protocol is NOT the client access wire. Clients talk apipb to access;
// access translates its terminal family into these messages and bridges the
// attachment/history/live streams. Payload DTOs are provider-native so the
// daemon never needs to parse client commands or access DTOs.
//
// Field numbers are append-only; never renumber or reuse.

message Hello {
  uint32 version = 1;
  string client = 2;
  string server = 3;
}

// ProtocolError 是 provider 的 typed 错误；code 沿用 clientruntime/access
// code 语义（400/403/404/409/429/500/503）。
message ProtocolError {
  uint32 code = 1;
  string message = 2;
}

message Size {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalRef {
  string terminal_id = 1;
}

message TerminalScrollback {
  uint32 size = 1;
  int64 max_bytes = 2;
  int64 max_age_millis = 3;
}

message TerminalCreateSpec {
  string terminal_id = 1;
  string name = 2;
  repeated string command = 3;
  string cwd = 4;
  repeated string env = 5;
  map<string, string> tags = 6;
  Size size = 7;
  TerminalScrollback scrollback = 8;
}

message TerminalInfo {
  string terminal_id = 1;
  string name = 2;
  repeated string command = 3;
  map<string, string> tags = 4;
  Size size = 5;
  string state = 6;
  string cwd = 7;
  string live_cwd = 8;
  int64 created_at_unix_nano = 9;
  int64 exited_at_unix_nano = 10;
  int32 exit_code = 11;
  string foreground_process = 12;
  string foreground_cwd = 13;
  int64 last_output_at_unix_nano = 14;
  // attachment_count 是 provider server 级 attachment 视图计数。
  int32 attachment_count = 15;
}

message TerminalListCommand {}

message TerminalListResult {
  repeated TerminalInfo terminals = 1;
}

message TerminalGetResult {
  TerminalInfo terminal = 1;
}

message TerminalSetMetadataCommand {
  TerminalRef terminal = 1;
  string name = 2;
  map<string, string> tags = 3;
}

message TerminalSetTagsCommand {
  TerminalRef terminal = 1;
  map<string, string> tags = 2;
}

message TerminalDefaultsCommand {}

message TerminalDefaults {
  repeated string command = 1;
  string cwd = 2;
  string platform = 3;
}

message PathListDirectoriesCommand {
  string prefix = 1;
  int32 limit = 2;
}

message PathDirectory {
  string name = 1;
  string path = 2;
}

message PathListDirectoriesResult {
  string base_path = 1;
  repeated PathDirectory entries = 2;
  bool missing = 3;
  bool truncated = 4;
}

message Acknowledge {}

// ---------------------------------------------------------------------------
// History surface (provider-native copy of the public history shapes; field
// numbers are kept stable and append-only). provider TerminalRef only carries
// terminal_id; access adds endpoint/session correlation.
// ---------------------------------------------------------------------------

enum HistoryWindowMode {
  HISTORY_WINDOW_MODE_UNSPECIFIED = 0;
  HISTORY_WINDOW_MODE_LATEST = 1;
  HISTORY_WINDOW_MODE_OLDER = 2;
  HISTORY_WINDOW_MODE_NEWER = 3;
  HISTORY_WINDOW_MODE_OLDEST = 4;
}

enum HistoryWindowOperation {
  HISTORY_WINDOW_OPERATION_UNSPECIFIED = 0;
  HISTORY_WINDOW_OPERATION_REPLACE = 1;
  HISTORY_WINDOW_OPERATION_PREPEND = 2;
  HISTORY_WINDOW_OPERATION_APPEND = 3;
}

enum HistorySearchDirection {
  HISTORY_SEARCH_DIRECTION_UNSPECIFIED = 0;
  HISTORY_SEARCH_DIRECTION_FORWARD = 1;
  HISTORY_SEARCH_DIRECTION_BACKWARD = 2;
}

enum HistorySearchMode {
  HISTORY_SEARCH_MODE_UNSPECIFIED = 0;
  HISTORY_SEARCH_MODE_TEXT = 1;
  HISTORY_SEARCH_MODE_GLOB = 2;
  HISTORY_SEARCH_MODE_REGEX = 3;
}

enum HistoryCursorSegment {
  HISTORY_CURSOR_SEGMENT_UNSPECIFIED = 0;
  HISTORY_CURSOR_SEGMENT_COMMITTED = 1;
  HISTORY_CURSOR_SEGMENT_CURRENT_PRIMARY_FRAME = 2;
  HISTORY_CURSOR_SEGMENT_ARCHIVED_PRIMARY_FRAME = 3;
  HISTORY_CURSOR_SEGMENT_CURRENT_ALT_FRAME = 4;
}

enum RowOwnership {
  ROW_OWNERSHIP_UNSPECIFIED = 0;
  ROW_OWNERSHIP_PERSISTED = 1;
  ROW_OWNERSHIP_LIVE_TAIL_RECLAIMED = 2;
  ROW_OWNERSHIP_LIVE_TAIL_LIVE = 3;
  ROW_OWNERSHIP_SCREEN = 4;
}

enum CursorShape {
  CURSOR_SHAPE_UNSPECIFIED = 0;
  CURSOR_SHAPE_BLOCK = 1;
  CURSOR_SHAPE_UNDERLINE = 2;
  CURSOR_SHAPE_BAR = 3;
}

message CellStyle {
  string foreground = 1;
  string background = 2;
  bool bold = 3;
  bool italic = 4;
  bool underline = 5;
  bool blink = 6;
  bool reverse = 7;
  bool strikethrough = 8;
}

message ScreenCell {
  string content = 1;
  int32 width = 2;
  CellStyle style = 3;
  string link_url = 4;
  string link_params = 5;
}

message ScreenRow {
  repeated ScreenCell cells = 1;
  CellStyle tail_fill = 2;
  // wrapped 表示本物理行通过终端软换行继续到下一行。
  bool wrapped = 3;
}

message TerminalCursor {
  int32 row = 1;
  int32 col = 2;
  bool visible = 3;
  CursorShape shape = 4;
  bool blink = 5;
}

message TerminalModes {
  bool alternate_screen = 1;
  bool alternate_scroll = 2;
  bool mouse_tracking = 3;
  bool mouse_x10 = 4;
  bool mouse_normal = 5;
  bool mouse_button_event = 6;
  bool mouse_any_event = 7;
  bool mouse_sgr = 8;
  bool bracketed_paste = 9;
  bool application_cursor = 10;
  bool auto_wrap = 11;
}

message HistoryCursor {
  reserved 3;
  uint64 line_id = 1;
  int32 row_in_line = 2;
  HistoryCursorSegment segment = 4;
}

message HistoryRange {
  uint64 start_line_id = 1;
  int32 start_col = 2;
  uint64 end_line_id = 3;
  int32 end_col = 4;
}

message HistoryWindowCommand {
  reserved 1, 4;
  TerminalRef terminal = 2;
  HistoryWindowMode mode = 3;
  int32 limit = 5;
  int32 cols = 6;
  string token = 7;
  uint64 history_generation = 8;
  HistoryCursor before_cursor = 9;
  HistoryCursor after_cursor = 10;
  uint64 boundary_first_line_id = 11;
  uint64 boundary_last_line_id = 12;
  HistoryRange range = 13;
}

message HistoryCopyCommand {
  reserved 1;
  TerminalRef terminal = 2;
  HistoryWindowCommand window = 3;
  int32 max_lines = 4;
  int32 max_bytes = 5;
}

message HistoryTextPosition {
  uint64 line_id = 1;
  int32 col = 2;
}

message HistorySearchCommand {
  reserved 1;
  TerminalRef terminal = 2;
  string token = 3;
  uint64 history_generation = 4;
  string query = 5;
  HistorySearchDirection direction = 6;
  int32 cols = 7;
  int32 limit = 8;
  HistoryTextPosition start = 9;
  HistorySearchMode mode = 10;
  int32 context_before = 11;
  // scan returns chronological match batches without a replacement window.
  bool scan = 12;
  int32 max_matches = 13;
}

message HistoryReleaseCommand {
  reserved 1;
  TerminalRef terminal = 2;
  string token = 3;
  uint64 history_generation = 4;
}

message HistoryBacklogStatusCommand {
  reserved 1;
  TerminalRef terminal = 2;
}

message HistoryLineSpan {
  int32 start_row = 1;
  int32 end_row = 2;
  string row_kind = 3;
  uint64 logical_line_id = 4;
  uint64 session_id = 5;
  uint64 frame_id = 6;
  bool fixed_grid = 7;
  int32 screen_cols = 8;
  int64 timestamp_start_unix_nano = 9;
  int64 timestamp_end_unix_nano = 10;
  bool clipped_before = 11;
  bool clipped_after = 12;
}

message HistoryRow {
  reserved 13;
  ScreenRow row = 1;
  int64 timestamp_unix_nano = 2;
  string row_kind = 3;
  bool wrapped = 4;
  RowOwnership ownership = 5;
  HistoryCursorSegment segment = 6;
  uint64 session_id = 7;
  uint64 frame_id = 8;
  bool fixed_grid = 9;
  int32 screen_cols = 10;
  int32 screen_rows = 11;
  bool screen_row_set = 12;
  uint64 logical_line_id = 14;
  int32 row_in_line = 15;
}

message HistoryViewportAnchor {
  uint64 top_line_id = 1;
  int32 top_cell_offset = 2;
  bool at_end = 3;
  uint32 screen_cols = 4;
  uint32 screen_rows = 5;
}

message HistoryWindowResult {
  reserved 7;
  TerminalRef terminal = 1;
  string token = 2;
  HistoryWindowOperation operation = 3;
  Size size = 4;
  repeated HistoryRow rows = 5;
  repeated HistoryLineSpan lines = 6;
  int32 loaded_rows = 8;
  int32 total_rows = 9;
  int32 loaded_lines = 10;
  int32 logical_total = 11;
  bool has_more = 12;
  uint64 history_generation = 13;
  uint64 first_row_id = 14;
  uint64 last_row_id = 15;
  uint64 first_line_id = 16;
  uint64 last_line_id = 17;
  HistoryCursor cursor = 18;
  int64 timestamp_unix_nano = 19;
  HistoryViewportAnchor viewport_anchor = 20;
}

message HistoryCopyResult {
  string text = 1;
  HistoryTextPosition next = 2;
  bool done = 3;
}

message HistorySearchResult {
  bool found = 1;
  HistoryRange match = 2;
  HistoryWindowResult window = 3;
  bool wrapped = 4;
  repeated HistoryRange scan_matches = 5;
  HistoryTextPosition scan_next = 6;
  bool scan_done = 7;
}

message HistoryBacklogStatusResult {
  TerminalRef terminal = 1;
  bool history_enabled = 2;
  string output_buffer_policy = 3;
  int64 buffer_capacity_bytes = 4;
  int64 resident_bytes = 5;
  int64 aggregate_resident_bytes = 6;
  int64 aggregate_budget_bytes = 7;
  uint64 dropped_bytes = 8;
  uint64 gap_count = 9;
  int64 output_buffer_wait_nanos = 10;
  bool unavailable = 11;
  string unavailable_reason = 12;
  bool closed = 13;
}

message LiveScreenNextCommand {
  reserved 1;
  TerminalRef terminal = 2;
  uint64 observed_revision = 3;
}

message ScreenRowCopy {
  int32 source_row = 1;
  int32 destination_row = 2;
  int32 count = 3;
}

message ScreenRowReplace {
  int32 row_index = 1;
  ScreenRow row = 2;
}

message NativeScreenResult {
  TerminalRef terminal = 1;
  uint64 live_revision = 2;
  Size size = 3;
  repeated ScreenRowReplace row_replacements = 4;
  bool alternate_screen = 5;
  TerminalCursor cursor = 6;
  TerminalModes modes = 7;
  int64 timestamp_unix_nano = 8;
  uint64 base_revision = 9;
  repeated ScreenRowCopy row_copies = 10;
  bool full_replace = 11;
}


enum TerminalEventType {
  TERMINAL_EVENT_TYPE_UNSPECIFIED = 0;
  TERMINAL_EVENT_TYPE_CREATED = 1;
  TERMINAL_EVENT_TYPE_EXITED = 2;
  TERMINAL_EVENT_TYPE_RESIZED = 3;
  TERMINAL_EVENT_TYPE_METADATA_CHANGED = 4;
  TERMINAL_EVENT_TYPE_REMOVED = 5;
  TERMINAL_EVENT_TYPE_CHANGED = 6;
}

message TerminalAttachmentProjection {
  int32 attachment_count = 1;
  uint64 resize_epoch = 2;
  ResizeControl resize_control = 3;
}

message TerminalEvent {
  TerminalEventType type = 1;
  string terminal_id = 2;
  TerminalInfo terminal = 3;
  TerminalAttachmentProjection attachment = 4;
  int64 timestamp_unix_nano = 5;
}

message EventSubscribeCommand {
  string terminal_id = 1;
  repeated TerminalEventType types = 2;
}

message EventSubscriptionReleaseCommand {
  bytes opaque_token = 1;
}

message EventSubscriptionResult {
  bytes opaque_token = 1;
  repeated TerminalEvent initial_events = 2;
}

message Event {
  TerminalEvent terminal_event = 1;
}

enum AttachmentMode {
  ATTACHMENT_MODE_UNSPECIFIED = 0;
  ATTACHMENT_MODE_COLLABORATOR = 1;
  ATTACHMENT_MODE_OBSERVER = 2;
}

enum ResizePolicy {
  RESIZE_POLICY_UNSPECIFIED = 0;
  RESIZE_POLICY_OWNER = 1;
  RESIZE_POLICY_FOLLOWER = 2;
  RESIZE_POLICY_OBSERVER = 3;
}

enum ResizeReason {
  RESIZE_REASON_UNSPECIFIED = 0;
  RESIZE_REASON_OWNER = 1;
  RESIZE_REASON_FOLLOWER = 2;
  RESIZE_REASON_OBSERVER = 3;
  RESIZE_REASON_SIZE_LOCKED = 4;
}

message TerminalAttachCommand {
  TerminalRef terminal = 1;
  AttachmentMode mode = 2;
  ResizePolicy resize_policy = 3;
  string surface_id = 4;
  string view_id = 5;
}

message TerminalDetachCommand {
  bytes opaque_token = 1;
}

message TerminalInputCommand {
  bytes opaque_token = 1;
  bytes data = 2;
}

message TerminalResizeCommand {
  bytes opaque_token = 1;
  Size size = 2;
  ResizePolicy resize_policy = 3;
  bool take_ownership = 4;
  uint64 expected_owner_epoch = 5;
}

message TerminalResizeLockCommand {
  bytes opaque_token = 1;
  bool locked = 2;
}

message ResizeOwnership {
  string owner_attachment_id = 1;
  string owner_surface_id = 2;
  string owner_view_id = 3;
  Size size = 4;
  bool size_locked = 5;
  uint64 epoch = 6;
}

message ResizeControl {
  bool can_resize = 1;
  ResizeReason reason = 2;
  bool size_locked = 3;
  string surface_id = 4;
  string owner_surface_id = 5;
  string owner_view_id = 6;
  ResizeOwnership resize_ownership = 7;
}

message AttachmentHandle {
  bytes opaque_token = 1;
  string terminal_id = 2;
  AttachmentMode mode = 3;
  ResizePolicy resize_policy = 4;
  string surface_id = 5;
  string view_id = 6;
  Size size = 7;
  uint64 epoch = 8;
}

message TerminalAttachResult {
  AttachmentHandle attachment = 1;
  ResizeControl resize_control = 2;
}

message TerminalResizeResult {
  Size size = 1;
  bool resized = 2;
  ResizeControl resize_control = 3;
}

// Request 承载一个 provider command。id 由 access 分配并原样回传。
message Request {
  uint64 id = 1;
  oneof command {
    TerminalCreateSpec terminal_create = 10;
    TerminalListCommand terminal_list = 11;
    TerminalRef terminal_get = 12;
    TerminalRef terminal_restart = 13;
    TerminalRef terminal_kill = 14;
    TerminalRef terminal_remove = 15;
    TerminalSetMetadataCommand terminal_set_metadata = 16;
    TerminalSetTagsCommand terminal_set_tags = 17;
    TerminalDefaultsCommand terminal_defaults = 18;
    PathListDirectoriesCommand path_list_directories = 19;
    TerminalAttachCommand terminal_attach = 20;
    TerminalDetachCommand terminal_detach = 21;
    TerminalInputCommand terminal_input = 22;
    TerminalResizeCommand terminal_resize = 23;
    TerminalResizeLockCommand terminal_resize_lock = 24;
    HistoryWindowCommand history_window = 30;
    HistoryCopyCommand history_copy = 31;
    HistoryReleaseCommand history_release = 32;
    HistorySearchCommand history_search = 33;
    HistoryBacklogStatusCommand history_backlog_status = 34;
    LiveScreenNextCommand live_screen_next = 35;
    EventSubscribeCommand event_subscribe = 36;
    EventSubscriptionReleaseCommand event_release = 37;
  }
}

// Response 是对应 Request 的结果。error 非空时 result 必须为空。
message Response {
  uint64 id = 1;
  ProtocolError error = 2;
  oneof result {
    TerminalInfo terminal_create = 10;
    TerminalListResult terminal_list = 11;
    TerminalGetResult terminal_get = 12;
    Acknowledge terminal_restart = 13;
    Acknowledge terminal_kill = 14;
    Acknowledge terminal_remove = 15;
    Acknowledge terminal_set_metadata = 16;
    Acknowledge terminal_set_tags = 17;
    TerminalDefaults terminal_defaults = 18;
    PathListDirectoriesResult path_list_directories = 19;
    TerminalAttachResult terminal_attach = 20;
    Acknowledge terminal_detach = 21;
    Acknowledge terminal_input = 22;
    TerminalResizeResult terminal_resize = 23;
    TerminalResizeResult terminal_resize_lock = 24;
    HistoryWindowResult history_window = 30;
    HistoryCopyResult history_copy = 31;
    Acknowledge history_release = 32;
    HistorySearchResult history_search = 33;
    HistoryBacklogStatusResult history_backlog_status = 34;
    NativeScreenResult live_screen = 35;
    EventSubscriptionResult event_subscribe = 36;
    Acknowledge event_release = 37;
  }
}
